<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">NodeSnip Chrome Web Store promo tile</title>
  <desc id="desc">NodeSnip icon with the text Pick any element and Copy or save as PNG.</desc>
  <rect width="440" height="280" fill="#0f172a"/>

  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="square">
    <path d="M42 82V42h40"/>
    <path d="M136 42h40v40"/>
    <path d="M42 136v40h40"/>
    <path d="M136 176h40v-40"/>
  </g>
  <circle cx="109" cy="109" r="11" fill="#3b82f6"/>

  <text x="208" y="93" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700">NodeSnip</text>
  <text x="208" y="126" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Pick any element</text>

  <line x1="42" y1="215" x2="398" y2="215" stroke="#334155" stroke-width="1"/>
  <text x="42" y="249" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">COPY</text>
  <circle cx="117" cy="243" r="3" fill="#3b82f6"/>
  <text x="137" y="249" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">SAVE AS PNG</text>
</svg>
