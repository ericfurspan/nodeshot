<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeShot Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #e5e5e5;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #filename {
      flex: 1;
      max-width: 280px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 13px;
      padding: 5px 8px;
      outline: none;
    }
    #filename:focus { border-color: #3b82f6; }

    .btn {
      padding: 5px 14px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    #btn-png { background: #3b82f6; color: #fff; }
    #btn-png:hover { background: #2563eb; }
    #btn-pdf { background: #6366f1; color: #fff; }
    #btn-pdf:hover { background: #4f46e5; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 12px;
      color: #888;
      margin-left: auto;
    }

    #canvas-area {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
    }

    #crop-canvas {
      display: block;
      max-width: 100%;
      image-rendering: pixelated;
      cursor: default;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-size: 15px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="filename" type="text" placeholder="nodeshot-filename" />
    <button class="btn" id="btn-png" disabled>Save PNG</button>
    <button class="btn" id="btn-pdf" disabled>Save PDF</button>
    <span id="status"></span>
  </div>
  <div id="canvas-area">
    <canvas id="crop-canvas"></canvas>
  </div>
  <div id="loading">Loading…</div>
  <script src="./preview.js"></script>
</body>
</html>
